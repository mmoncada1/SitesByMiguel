<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Square background, no rounded corners -->
  <rect width="400" height="400" fill="#0f172a"/>

  <!-- Bold 'M' wordmark, scaled to match the favicon proportions -->
